<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="图书借阅界面.css">
    <title>图书馆管理系统 - 管理员页面</title>
    <style>
        /* 可根据实际需求调整以下样式 */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f5f5f5;
        }

        #logo img {
            height: 50px;
        }

        #nav ul {
            list-style: none;
            display: flex;
        }

        #nav ul li {
            margin-right: 20px;
        }

        #nav ul li a {
            text-decoration: none;
            color: #333;
        }

        #userInfo {
            display: flex;
            align-items: center;
        }

        #userInfo img {
            height: 40px;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div id="header">
        <div id="logo">
            <img src="图书馆标志.png" alt="图书馆标志">
        </div>
        <div id="nav">
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#">图书管理</a></li>
                <li><a href="#">用户管理</a></li>
                <li><a href="#">关于我们</a></li>
            </ul>
        </div>
        <div id="userInfo">
            <img src="管理员头像.jpg" alt="管理员头像">
            <span>管理员李四</span>
        </div>
    </div>
    <div style="text-align: center; margin-top: 50px;">
        <button style="padding: 20px 40px; font-size: 18px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; margin-right: 20px;"><a href="系统3.html">管理员管理系统</button></a>
        <button style="padding: 20px 40px; font-size: 18px; background-color: #2196F3; color: white; border: none; border-radius: 5px;"><a href="系统4.html">管理员修改系统</button></a>
    </div>
</body>

</html>
